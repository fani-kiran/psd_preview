<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photoshop Mobile Preview</title>
  <!-- Fullscreen, Standalone & Safe Area Meta Tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PS Preview">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Main Viewport Container -->
  <div id="appContainer">
    <div id="canvasViewport">
      <img id="previewImage" src="" alt="" draggable="false">
    </div>

    <!-- Empty / Waiting State -->
    <div id="emptyState" class="empty-state">
      <div class="empty-card">
        <div class="empty-icon-wrapper">
          <svg class="ps-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="48" height="48" rx="10" fill="#001E36"/>
            <path d="M12 14H21.5C25.6421 14 29 17.134 29 21C29 24.866 25.6421 28 21.5 28H17V34H12V14ZM17 23.5H21.5C22.8807 23.5 24 22.3807 24 21C24 19.6193 22.8807 18.5 21.5 18.5H17V23.5Z" fill="#31A8FF"/>
            <path d="M30 31.5C30.8 32.8 32.5 34 35 34C37 34 38.5 33 38.5 31.2C38.5 27.5 30.5 28.5 30.5 22.8C30.5 19.5 33.2 18 36.5 18C38.5 18 40.5 19 41.5 20.2L39 22.8C38.2 21.8 37.2 21.2 36 21.2C34.8 21.2 34 22 34 22.8C34 26 42 25.2 42 30.8C42 34.5 38.8 36 35 36C32.2 36 29.8 34.8 28.5 33L30 31.5Z" fill="#31A8FF"/>
          </svg>
        </div>
        <h2 id="emptyTitle">Waiting for Photoshop...</h2>
        <p id="emptySubtext">Connect via USB cable and open a document in Photoshop.</p>
        <div class="connection-status-pill">
          <span class="status-dot disconnected" id="statusDot"></span>
          <span id="statusText">Connecting to Bridge...</span>
        </div>
        <button id="enterFullscreenBtn" class="btn-fullscreen-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          Enter Fullscreen Mode
        </button>
        <div id="iosInstallTip" class="ios-tip hidden">
          💡 <strong>iPhone tip:</strong> Tap the Safari Share button <span class="share-icon">⎙</span> and select <strong>"Add to Home Screen"</strong> for a 100% borderless, native fullscreen experience!
        </div>
      </div>
    </div>

    <!-- Auto-hiding Minimal HUD -->
    <div id="hudOverlay" class="hud-overlay visible">
      <div class="hud-pill">
        <div class="hud-indicator">
          <span class="status-dot connected" id="hudDot"></span>
          <span class="hud-docname" id="hudDocName">Document</span>
        </div>
        <div class="hud-divider"></div>
        <button id="zoomModeBtn" class="hud-btn" title="Toggle Zoom Mode">
          <span id="hudZoomLabel">FIT</span>
        </button>
        <div class="hud-divider"></div>
        <button id="lockOrientationBtn" class="hud-btn" title="Lock Orientation">
          <svg id="lockIconUnlocked" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
          </svg>
          <svg id="lockIconLocked" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#31A8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </button>
        <div class="hud-divider"></div>
        <button id="hudFullscreenBtn" class="hud-btn" title="Fullscreen">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
